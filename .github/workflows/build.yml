name: build-petdfy

# ── 铁律 1：代码变更才编译，文档变更不触发 ──────────────────────────
# 只有 src/ layout/ assets_src/ Makefile control 与 workflow 本身会触发构建。
# 任何 .md、docs/、MEMORY/ 的改动都不触发（也顺带防止 CI 回写记忆点时自激）。
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'MEMORY/**'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sha256: ${{ steps.verify.outputs.sha256 }}
      arch: ${{ steps.verify.outputs.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          brew install ldid dpkg xz || brew upgrade ldid dpkg xz || true
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-v1

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          if [ ! -d "$THEOS/makefiles" ]; then
            rm -rf "$THEOS"
            git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          fi
          if [ ! -d "$THEOS/sdks" ]; then
            git clone --depth=1 https://github.com/theos/sdks.git "$THEOS/sdks"
          fi
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          ls "$THEOS/sdks" | tail -5

      # ── 铁律 2：每次编译自动递增版本号（base + build.N）──────────────
      - name: Compute version
        id: ver
        run: |
          BASE=$(grep '^Version:' control | awk '{print $2}' | cut -d'+' -f1)
          B=$(printf "%03d" "${GITHUB_RUN_NUMBER}")
          V="${BASE}+build.${B}"
          sed -i '' "s|^Version: .*|Version: ${V}|" control
          echo "version=${V}" >> $GITHUB_OUTPUT
          echo "build=${B}" >> $GITHUB_OUTPUT
          echo "base=${BASE}" >> $GITHUB_OUTPUT
          echo "本轮版本：${V}"
          grep '^Version:' control

      - name: Prepare assets
        run: |
          make assets
          du -sh "layout/Library/Application Support/PetDFY.bundle" || true

      - name: Build (arm64 + arm64e)
        run: |
          set -o pipefail
          make clean all 2>&1 | tee build.log
          find .theos layout -name "*.dylib" -type f 2>/dev/null | while read f; do
            echo "$f"; lipo -info "$f"; done

      - name: Fallback build (dynamic_lookup, no libsubstrate)
        if: failure()
        run: |
          set -o pipefail
          sed -i '' 's/^PetDFY_LIBRARIES = substrate/PetDFY_LDFLAGS = -Wl,-undefined,dynamic_lookup/' Makefile || true
          make clean all 2>&1 | tee build-fallback.log

      - name: Build diag tweak
        if: always() && !cancelled()
        run: |
          set -o pipefail
          cd diag
          make clean all 2>&1 | tee diag-build.log || true
          make package FINALPACKAGE=1 2>&1 | tee diag-package.log || true
          ls -l packages/ || true

      - name: Package (manual, avoid theos rebuild)
        if: always() && !cancelled()
        run: |
          set -x
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p packages
          # theos 的 make all 会把产物放进 .theos/_ ，直接合并进 layout 后手工打 deb，
          # 绕开 `make package` 的二次编译（它会切到 debug flags 暴露另一批错误）
          if [ -d .theos/_ ]; then
            echo "merging .theos/_ into layout"
            cp -R .theos/_/. layout/ 2>/dev/null || true
          fi
          mkdir -p layout/DEBIAN
          cp -f control layout/DEBIAN/control
          # 确保三个 dylib 都在 layout 里（merge 失败时兜底）
          DYN=layout/Library/MobileSubstrate/DynamicLibraries
          mkdir -p "$DYN"
          for f in $(find .theos -name "*.dylib" -type f 2>/dev/null | grep -v unsigned); do
            base=$(basename "$f")
            [ -f "$DYN/$base" ] || cp -f "$f" "$DYN/$base"
          done
          chmod 755 "$DYN"/*.dylib 2>/dev/null || true
          ls -l "$DYN"
          dpkg-deb -b layout "packages/PetDFY_${VER}_iphoneos-arm64e.deb" 2>&1 | tee package.log
          ls -lh packages/

      - name: Verify deb
        id: verify
        if: always() && !cancelled()
        run: |
          DEB=$(ls packages/*.deb | head -1)
          ARCH=$(dpkg-deb -f "$DEB" Architecture)
          SHA=$(shasum -a 256 "$DEB" | awk '{print $1}')
          echo "sha256=${SHA}" >> $GITHUB_OUTPUT
          echo "arch=${ARCH}" >> $GITHUB_OUTPUT
          dpkg-deb -I "$DEB"
          {
            echo "### PetDFY build #${GITHUB_RUN_NUMBER}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`${{ steps.ver.outputs.version }}\` |"
            echo "| deb | \`$(basename "$DEB")\` |"
            echo "| 架构 | \`$ARCH\` |"
            echo "| 大小 | $(du -h "$DEB" \| cut -f1) |"
            echo "| SHA256 | \`$SHA\` |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Collect dylibs
        if: always() && !cancelled()
        run: |
          mkdir -p out
          cp -v packages/*.deb out/ 2>/dev/null || true
          cp -v diag/packages/*.deb out/ 2>/dev/null || true
          find layout .theos -name "*.dylib" -type f -exec cp -v {} out/ \; 2>/dev/null || true
          lipo -info out/PetDFY.dylib || true
          shasum -a 256 out/* | tee out/SHA256.txt

      - name: Upload artifact
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: PetDFY-${{ steps.ver.outputs.version }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release
        if: always() && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PetDFY ${{ steps.ver.outputs.version }}
          body: |
            自动构建产物
            - 版本：${{ steps.ver.outputs.version }}
            - 架构：${{ steps.verify.outputs.arch }}
            - SHA256：${{ steps.verify.outputs.sha256 }}
          files: |
            packages/*.deb
            diag/packages/*.deb
          fail_on_unmatched_files: false
          make_latest: true

      - name: Upload diag
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: PetDFYDiag-db${{ github.run_number }}
          path: |
            diag/packages/*.deb
            diag/diag-build.log
            diag/diag-package.log
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            build.log
            build-fallback.log
            package.log
          if-no-files-found: ignore

      # ── 铁律 3：每次推送自动补记忆点 ─────────────────────────────────
      - name: Append build memory
        if: always()
        run: |
          D=$(date -u '+%Y-%m-%d %H:%M UTC')
          MSG=$(git log -1 --pretty=%s | sed 's/|/\\|/g')
          SHA=$(git rev-parse --short HEAD)
          if [ "${{ job.status }}" = "success" ]; then
            RES="✅ 成功"
            VER="${{ steps.ver.outputs.version }}"
            ARCH="${{ steps.verify.outputs.arch }}"
            DSH="${{ steps.verify.outputs.sha256 }}"
          else
            RES="❌ 失败"
            VER="${{ steps.ver.outputs.version }}"
            ARCH="-"
            DSH="-"
          fi
          cat >> MEMORY/03-构建日志.md <<EOF
          | #${{ github.run_number }} | ${D} | \`${SHA}\` | ${MSG} | \`${VER}\` | ${ARCH} | ${RES} | \`${DSH:0:16}\` |
          EOF
          tail -3 MEMORY/03-构建日志.md

      - name: Commit memory
        if: always()
        continue-on-error: true
        run: |
          git config user.name "petdfy-ci"
          git config user.email "ci@petdfy.local"
          git add MEMORY/03-构建日志.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(memory): build #${{ github.run_number }} [skip ci]"
          git pull --rebase --autostash || true
          git push || echo "记忆点回写失败（不影响产物）"
